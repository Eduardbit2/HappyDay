[project]
name = "happyday"
version = "0.1.0"
description = "Семейные дни рождения и персональные напоминания"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "tzdata>=2025.1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "uv==0.12.10", "playwright>=1.50,<2"]

[tool.uv]
package = false
required-version = "==0.12.10"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
