name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  APP_ENV: test
  APP_TELEGRAM_TOKEN: ""
  UV_PYTHON_DOWNLOADS: never

jobs:
  checks:
    name: Python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Tests
        run: uv run --no-sync pytest -q --junitxml=test-results/pytest.xml
      - name: Migration consistency
        run: uv run --no-sync python -m scripts.check_migrations
      - name: Install browser
        if: runner.os == 'Linux'
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Browser flows and responsive layout
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/check_auth_browser.py --channel chromium
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reports-${{ matrix.os }}
          path: |
            test-results/pytest.xml
            test-results/browser-*/*.png
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build and smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag happyday:ci .
      - name: Startup, health, permissions and restart
        run: python3 scripts/check_docker.py --image happyday:ci
